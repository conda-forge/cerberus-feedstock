{% set name = "Cerberus" %}
{% set version = "1.3.6" %}
{% set sha256 = "8c838758449f24136a5137fd1d8002abefccee602f203becfb70312481f8bf0e" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.lower() }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python >=3.7

  run:
    - python >=3.7
    - setuptools

test:
  imports:
    - cerberus

about:
  home: https://github.com/nicolaiarocci/cerberus
  license: ISC
  license_file: LICENSE
  summary: Lightweight, extensible schema and data validation tool for Python dictionaries.

extra:
  recipe-maintainers:
    - fdosani
    - kyleniemeyer
